<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhyStock</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="WhyStock home">
        <span class="brand-mark">W</span>
        <span>
          <strong>WhyStock</strong>
          <small>Reason-first market AI</small>
        </span>
      </a>
      <div class="topbar-meta">
        <button id="presentationButton" class="presentation-toggle" type="button">발표 모드</button>
        <span id="runtimeBadge" class="status-pill">live market</span>
        <span id="asOfText">loading</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="급등락 이벤트">
        <div class="sidebar-head">
          <h1>급등락 이벤트</h1>
          <span id="eventCount">0</span>
        </div>

        <section class="assistant-box" aria-label="AI 질문">
          <form id="assistantForm" class="assistant-form">
            <input
              id="assistantInput"
              type="text"
              placeholder="삼성전자 오늘 왜 움직였어?"
              autocomplete="off"
            />
            <button id="assistantSubmit" type="submit">질문</button>
          </form>
          <div id="assistantAnswer" class="assistant-answer" aria-live="polite" hidden></div>
        </section>

        <div id="moverList" class="mover-list"></div>
      </aside>

      <section class="workspace" aria-live="polite">
        <div class="quote-board">
          <div class="quote-title">
            <p class="eyebrow">Stock briefing</p>
            <h2 id="eventTitle">이벤트를 불러오는 중</h2>
            <p id="eventSubtitle" class="subtitle"></p>
          </div>
          <div class="metric">
            <span>현재가</span>
            <strong id="currentPrice">-</strong>
          </div>
          <div class="metric">
            <span>변동률</span>
            <strong id="changeRate">-</strong>
          </div>
          <div class="metric">
            <span>거래량 변화</span>
            <strong id="volumeChange">-</strong>
          </div>
          <div class="metric">
            <span>자료 기준</span>
            <strong id="dataBasis">-</strong>
          </div>
        </div>

        <div id="basisNote" class="basis-note"></div>

        <div class="primary-grid">
          <section class="panel reasons-panel">
            <div class="panel-head">
              <h3>상승/하락 원인</h3>
              <div class="panel-actions">
                <button id="watchButton" class="icon-button" type="button" title="관심종목 저장">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m12 3 2.7 5.47 6.03.88-4.36 4.25 1.03 6-5.4-2.84-5.4 2.84 1.03-6-4.36-4.25 6.03-.88Z" />
                  </svg>
                </button>
                <button id="analyzeButton" class="icon-button" type="button" title="AI 분석 다시 실행">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v6h-6" />
                  </svg>
                </button>
              </div>
            </div>
            <p id="summaryText" class="summary"></p>
            <ol id="reasonList" class="reason-list"></ol>
          </section>

          <section class="panel insight-panel">
            <section class="mini-section">
              <div class="panel-head">
                <h3>뉴스 타임라인</h3>
              </div>
              <div id="newsTimelineList" class="timeline-list"></div>
            </section>
            <section class="mini-section">
              <div class="panel-head">
                <h3>관심종목</h3>
              </div>
              <div id="watchlistList" class="watchlist-list"></div>
            </section>
          </section>
        </div>

        <div class="secondary-grid">
          <section class="panel">
            <div class="panel-head">
              <h3>근거 자료</h3>
            </div>
            <div id="sourceList" class="source-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>관련 종목</h3>
            </div>
            <div id="relatedList" class="related-list"></div>
          </section>

          <section class="panel term-panel">
            <div class="panel-head">
              <h3>감지된 용어</h3>
            </div>
            <div id="termButtons" class="term-buttons"></div>
            <p id="termExplanation" class="term-explanation">종목을 선택하면 화면 문장에서 감지된 용어가 표시됩니다.</p>
          </section>
        </div>

        <p class="disclaimer" id="disclaimerText">투자 추천이 아닌 정보 요약입니다.</p>
      </section>
    </main>

    <section id="presentationOverlay" class="presentation-overlay" role="dialog" aria-modal="true" aria-label="발표 모드" hidden>
      <div class="presentation-shell">
        <div class="presentation-top">
          <div>
            <span id="presentationCounter" class="presentation-counter">1 / 5</span>
            <strong id="presentationStepLabel">한눈에 보기</strong>
          </div>
          <button id="presentationClose" class="presentation-close" type="button">닫기</button>
        </div>
        <div id="presentationStage" class="presentation-stage"></div>
        <div class="presentation-controls">
          <button id="presentationPrev" type="button">이전</button>
          <div id="presentationDots" class="presentation-dots" aria-label="발표 단계"></div>
          <button id="presentationNext" type="button">다음</button>
        </div>
      </div>
    </section>

    <script src="/app.js" defer></script>
  </body>
</html>
